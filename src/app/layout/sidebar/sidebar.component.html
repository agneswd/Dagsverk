<aside class="app-sidebar-drawer" [class.collapsed]="collapsed">
  <!-- Brand Header -->
  <div class="sidebar-brand-header">
    <button
      mat-icon-button
      type="button"
      class="collapse-btn"
      (click)="toggleCollapsed()"
      [attr.aria-label]="collapsed ? 'Expand navigation' : 'Collapse navigation'"
    >
      <mat-icon>menu</mat-icon>
    </button>
    <div class="brand-text">
      <span class="brand-title title-medium">Dagsverk</span>
    </div>
  </div>

  <!-- Workspace Switcher (56px) -->
  <div
    class="workspace-switcher-wrapper"
    [matTooltip]="collapsed ? state.activeWorkspace().name : ''"
  >
    <button
      type="button"
      matRipple
      class="workspace-switcher-btn"
      [matMenuTriggerFor]="workspaceMenu"
      aria-label="Switch active workspace"
    >
      <div class="ws-avatar">
        <mat-icon class="ws-avatar-icon">business</mat-icon>
      </div>

      <div class="ws-info">
        <span class="ws-name title-small">{{ state.activeWorkspace().name }}</span>
        <span class="ws-employer body-small">{{
          state.activeWorkspace().organizationName ||
            state.activeWorkspace().workerName ||
            'Personal workspace'
        }}</span>
      </div>

      <mat-icon class="ws-arrow">expand_more</mat-icon>
    </button>

    <mat-menu #workspaceMenu="matMenu" class="m3-workspace-menu" xPosition="after">
      <div class="menu-heading label-small">Switch workspace</div>
      @for (ws of state.workspaces(); track ws.id) {
        <button
          mat-menu-item
          (click)="onSelectWorkspace(ws)"
          class="ws-menu-item"
          [class.is-active]="ws.id === state.activeWorkspaceId()"
        >
          <div class="ws-menu-row">
            <span class="ws-menu-leading">
              <span class="ws-menu-dot" [style.background-color]="ws.color || '#5F875F'"></span>
            </span>
            <span class="ws-menu-name body-medium">{{ ws.name }}</span>
            @if (ws.id === state.activeWorkspaceId()) {
              <mat-icon class="ws-menu-check">check</mat-icon>
            }
          </div>
        </button>
      }

      <button mat-menu-item (click)="onManageWorkspaces()" class="manage-ws-item">
        <span class="ws-menu-leading">
          <mat-icon class="manage-ws-icon">settings</mat-icon>
        </span>
        <span class="body-medium">Manage workspaces</span>
      </button>
    </mat-menu>
  </div>

  <!-- Navigation Destinations (56px) -->
  <mat-nav-list class="m3-nav-list">
    @for (item of navItems; track item.route) {
      <a
        mat-list-item
        [routerLink]="item.route"
        routerLinkActive="m3-nav-active"
        #rla="routerLinkActive"
        [activated]="rla.isActive"
        class="m3-nav-item"
      >
        <mat-icon matListItemIcon class="nav-icon" [class.filled]="rla.isActive">
          {{ item.icon }}
        </mat-icon>
        @if (!collapsed) {
          <span matListItemTitle class="nav-title label-large">{{ item.label }}</span>
        }
      </a>
    }
  </mat-nav-list>
</aside>
