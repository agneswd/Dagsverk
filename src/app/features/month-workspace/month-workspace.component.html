<mat-sidenav-container
  class="workspace-sidenav-container"
  [class.editor-open]="state.isEditorOpen()"
  [hasBackdrop]="!isWideScreen() && state.isEditorOpen()"
>
  <!-- Main Workspace Views -->
  <mat-sidenav-content class="workspace-main-content">
    <div class="workspace-content">
      <!-- M3 Metric Summary Banner -->
      <app-summary-cards></app-summary-cards>

      @if (state.isMonthUnstarted()) {
        <div class="month-notice">
          <div class="notice-icon"><mat-icon>calendar_add_on</mat-icon></div>
          <div class="notice-copy">
            <span class="title-small">This month has not started</span>
            <span class="body-small">Add the first entry to begin tracking this month.</span>
          </div>
          <button mat-button type="button" (click)="state.startMonth()">Add first entry</button>
        </div>
      }

      <!-- Active View: Ledger or Calendar -->
      <div class="view-surface">
        @if (state.activeView() === MonthViewPreference.Ledger) {
          <app-ledger-view></app-ledger-view>
        } @else {
          <app-calendar-view></app-calendar-view>
        }
      </div>
    </div>
  </mat-sidenav-content>

  <!-- M3 Day Editor Side Sheet (400px) -->
  <mat-sidenav
    position="end"
    [mode]="isWideScreen() ? 'side' : 'over'"
    [opened]="state.isEditorOpen()"
    (closed)="state.isCatchUpOpen() ? state.closeCatchUp() : state.closeEditor()"
    class="m3-day-editor-drawer"
  >
    <app-day-editor></app-day-editor>
  </mat-sidenav>
</mat-sidenav-container>
