<button
  mat-icon-button
  type="button"
  class="color-trigger"
  [matMenuTriggerFor]="colorMenu"
  [matTooltip]="label"
  [attr.aria-label]="label"
>
  <span class="selected-color" [style.background-color]="color"></span>
</button>

<mat-menu #colorMenu="matMenu" class="m3-color-menu">
  <div class="color-menu-content" (click)="$event.stopPropagation()">
    <span class="menu-label label-small">COLOR</span>
    <div class="color-grid" role="radiogroup" [attr.aria-label]="label">
      @for (option of colors; track option) {
        <button
          type="button"
          class="color-option"
          [class.selected]="color.toUpperCase() === option"
          [style.background-color]="option"
          [attr.aria-label]="option"
          [attr.aria-pressed]="color.toUpperCase() === option"
          (click)="select(option)"
        >
          @if (color.toUpperCase() === option) {
            <mat-icon>check</mat-icon>
          }
        </button>
      }
    </div>
    <div class="custom-picker">
      <div class="custom-picker-header">
        <span class="label-small">CUSTOM COLOR</span>
        <span class="custom-preview" [style.background-color]="color"></span>
      </div>
      <label>
        <span class="label-small">HUE</span>
        <input
          type="range"
          min="0"
          max="359"
          [value]="hue"
          (input)="updateCustomColor('hue', +$any($event.target).value)"
        />
      </label>
      <label>
        <span class="label-small">SATURATION</span>
        <input
          class="saturation-range"
          type="range"
          min="0"
          max="100"
          [value]="saturation"
          [style.--picker-hue]="hue"
          (input)="updateCustomColor('saturation', +$any($event.target).value)"
        />
      </label>
      <label>
        <span class="label-small">BRIGHTNESS</span>
        <input
          class="lightness-range"
          type="range"
          min="10"
          max="90"
          [value]="lightness"
          [style.--picker-hue]="hue"
          [style.--picker-saturation]="saturation + '%'"
          (input)="updateCustomColor('lightness', +$any($event.target).value)"
        />
      </label>
    </div>
  </div>
</mat-menu>
