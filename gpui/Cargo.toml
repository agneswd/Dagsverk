[workspace]
members = [
    "crates/dagsverk-app",
    "crates/dagsverk-core",
    "crates/dagsverk-data",
    "crates/dagsverk-export",
    "crates/dagsverk-ui",
]
default-members = ["crates/dagsverk-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
dagsverk-core = { path = "crates/dagsverk-core" }
dagsverk-data = { path = "crates/dagsverk-data" }
dagsverk-export = { path = "crates/dagsverk-export" }
dagsverk-ui = { path = "crates/dagsverk-ui" }
gpui = { version = "=0.2.2" }
unicode-segmentation = "=1.13.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
strip = "debuginfo"
